<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; }
  .slide { width: 1920px; height: 1080px; background: #f4ede1; color: #1c1a16; font-family: -apple-system, system-ui, sans-serif; padding: 80px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; color: #a35a2e; font-weight: 600; margin-bottom: 24px; }
  .headline { font-size: 72px; font-weight: 600; line-height: 1.15; max-width: 1400px; margin-bottom: 48px; }
  .stat-row { display: flex; gap: 64px; }
  .stat .num { font-size: 56px; font-weight: 700; color: #a35a2e; }
  .stat .lbl { font-size: 18px; color: #4a4740; margin-top: 4px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="kicker">Q3 Results</div>
    <div class="headline">Revenue grew 3× while support tickets fell by half.</div>
    <div class="stat-row">
      <div class="stat"><div class="num">$84K</div><div class="lbl">MRR, up 12% MoM</div></div>
      <div class="stat"><div class="num">1.8%</div><div class="lbl">Churn, down from 4.1%</div></div>
      <div class="stat"><div class="num">6m 12s</div><div class="lbl">Avg. session length</div></div>
    </div>
  </div>
</body>
</html>
