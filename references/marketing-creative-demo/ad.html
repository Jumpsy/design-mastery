<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; }
  .ad { width: 1080px; height: 1080px; background: #1c1a16; color: #f4ede1; font-family: Georgia, serif; display: flex; flex-direction: column; justify-content: space-between; padding: 80px; }
  .kicker { font-family: -apple-system, sans-serif; font-size: 18px; letter-spacing: 0.1em; text-transform: uppercase; color: #c9a24b; }
  .claim { font-style: italic; font-size: 88px; line-height: 1.1; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .proof { font-family: -apple-system, sans-serif; font-size: 20px; color: #b7b0a1; }
  .cta { font-family: -apple-system, sans-serif; font-weight: 600; font-size: 20px; background: #c9a24b; color: #1c1a16; padding: 16px 32px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="ad">
    <div class="kicker">Fieldnote</div>
    <div class="claim">Single origin.<br>Roasted this week.</div>
    <div class="footer">
      <div class="proof">Free shipping over $30</div>
      <div class="cta">Shop the roast</div>
    </div>
  </div>
</body>
</html>
