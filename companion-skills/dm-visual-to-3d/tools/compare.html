<!doctype html>
<meta charset="utf-8"><title>Reference vs render compare</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;background:#0b0b0d;color:#bbb;font:12px/1.4 ui-monospace,monospace}
  header{padding:10px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #222}
  canvas{display:block;max-width:100vw;margin:0 auto}
  input[type=range]{width:160px}
  .m{color:#9fd}
</style>
<header>
  <label>Reference <input type="file" id="a" accept="image/*"></label>
  <label>Render <input type="file" id="b" accept="image/*"></label>
  <label>Mode <select id="mode"><option>blend</option><option>difference</option><option>edges</option></select></label>
  <label>Blend <input type="range" id="k" min="0" max="100" value="50"></label>
  <span class="m" id="m">load both images (they are resized to the same size; match the camera angle first)</span>
</header>
<canvas id="c" width="1200" height="675"></canvas>
<script>
/* Analysis-by-synthesis check: put the model render over the reference, find proportion errors by eye
   (blend/edges) and by number (mean absolute difference, edge overlap). Runs fully offline in the browser. */
const A=new Image(),B=new Image(),c=document.getElementById('c'),x=c.getContext('2d',{willReadFrequently:true});
const load=(el,img)=>el.onchange=()=>{const f=el.files[0];if(f){img.onload=draw;img.src=URL.createObjectURL(f)}};
load(a,A);load(b,B);['mode','k'].forEach(i=>document.getElementById(i).oninput=draw);
function px(img){const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const g=t.getContext('2d');g.drawImage(img,0,0,c.width,c.height);return g.getImageData(0,0,c.width,c.height);}
function sobel(d,w,h){const g=new Float32Array(w*h),o=new Uint8Array(w*h);for(let i=0;i<w*h;i++)g[i]=.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2];
  for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const i=y*w+xx,gx=-g[i-w-1]-2*g[i-1]-g[i+w-1]+g[i-w+1]+2*g[i+1]+g[i+w+1],gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1];o[i]=Math.hypot(gx,gy)>110?1:0;}return o;}
function draw(){if(!A.complete||!B.complete||!A.naturalWidth||!B.naturalWidth)return;
  const w=c.width,h=c.height,pa=px(A),pb=px(B),mode=document.getElementById('mode').value,k=document.getElementById('k').value/100;
  const out=x.createImageData(w,h);let sum=0;
  if(mode==='edges'){const ea=sobel(pa.data,w,h),eb=sobel(pb.data,w,h);let inter=0,uni=0;
    for(let i=0;i<w*h;i++){const a1=ea[i],b1=eb[i];inter+=a1&b1;uni+=a1|b1;out.data[i*4]=a1?255:0;out.data[i*4+1]=b1?255:0;out.data[i*4+2]=a1&&b1?255:0;out.data[i*4+3]=255;}
    document.getElementById('m').textContent='edge overlap (IoU of edge pixels): '+(uni?(inter/uni).toFixed(3):'n/a')+'  | red=reference only, green=render only, white=match';}
  else{for(let i=0;i<w*h*4;i+=4){for(let j=0;j<3;j++){const d=pa.data[i+j]-pb.data[i+j];sum+=Math.abs(d);
      out.data[i+j]=mode==='blend'?pa.data[i+j]*(1-k)+pb.data[i+j]*k:Math.min(255,Math.abs(d)*2);}out.data[i+3]=255;}
    document.getElementById('m').textContent='mean abs difference: '+(sum/(w*h*3)).toFixed(1)+' / 255 (lower is closer)';}
  x.putImageData(out,0,0);}
</script>
