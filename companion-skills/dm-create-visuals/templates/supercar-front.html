<!doctype html>
<meta charset="utf-8"><title>Generic supercar, front view (pure SVG, original, no marks)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0b0b0d}
  .stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px}
  svg{width:min(100vw,calc(100vh*1.5));height:auto;display:block;transform-style:preserve-3d;will-change:transform}
  .cap{position:fixed;left:16px;bottom:12px;font:11px/1.2 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8e}
  @media (prefers-reduced-motion:no-preference){
    .led{animation:led 3.2s ease-in-out infinite}
    .sweep{animation:sweep 7s cubic-bezier(.6,0,.2,1) infinite}
    #car{animation:rise 1.4s cubic-bezier(.16,1,.3,1) both}
  }
  @keyframes led{0%,100%{opacity:.75}50%{opacity:1}}
  @keyframes sweep{0%{transform:translateX(-700px)}55%,100%{transform:translateX(900px)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(1.04)}to{opacity:1;transform:none}}
</style>
<div class="stage"><svg id="s" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c9c6"/><stop offset=".55" stop-color="#b79b9c"/><stop offset="1" stop-color="#8f7f86"/></linearGradient>
  <linearGradient id="asph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3e"/><stop offset="1" stop-color="#17171a"/></linearGradient>
  <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7d0a0a"/><stop offset=".35" stop-color="#d1201b"/><stop offset="1" stop-color="#e8352a"/></linearGradient>
  <linearGradient id="paintV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a55" stop-opacity=".55"/><stop offset=".45" stop-color="#ff3b2a" stop-opacity="0"/><stop offset="1" stop-color="#3a0000" stop-opacity=".55"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30343c"/><stop offset=".5" stop-color="#0b0c10"/><stop offset="1" stop-color="#050506"/></linearGradient>
  <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2c30"/><stop offset="1" stop-color="#0d0d0f"/></linearGradient>
  <radialGradient id="hood" cx=".5" cy=".3" r=".8"><stop offset="0" stop-color="#ff7a63" stop-opacity=".75"/><stop offset=".5" stop-color="#ff3b2a" stop-opacity=".0"/></radialGradient>
  <pattern id="mesh" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#08080a"/><path d="M0 4.5H9M4.5 0V9" stroke="#2a2a30" stroke-width="1.6"/></pattern>
  <pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#101012"/><path d="M0 0H4V4H0zM4 4H8V8H4z" fill="#1d1d21"/></pattern>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter><filter id="blur14"><feGaussianBlur stdDeviation="14"/></filter><filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  <clipPath id="clipR"><rect x="600" y="0" width="600" height="800"/></clipPath>

  <!-- RIGHT HALF of the car, mirrored for the left -->
  <g id="half">
    <!-- tyre sliver + arch -->
    <path d="M972 552 Q1004 536 1034 540 Q1050 562 1048 690 Q1046 714 1020 718 L990 716 Q972 700 972 552Z" fill="#0a0a0b"/><path d="M1000 548 Q1030 546 1040 566" stroke="#3a3a40" stroke-width="3" fill="none" opacity=".8"/>
    <path d="M985 600 L1034 592 L1038 640 L988 650Z" fill="#9b1212" opacity=".85"/>
    <!-- body main (fender+hood+nose) -->
    <path id="bodyR" d="M600 470 C700 470 800 468 872 462 C925 456 962 478 988 520 C1010 552 1020 592 1012 640 C1004 676 970 690 930 688 L840 678 C760 668 680 664 600 664 Z" fill="url(#paint)"/>
    <path d="M600 470 C700 470 800 468 872 462 C925 456 962 478 988 520 C1010 552 1020 592 1012 640 C1004 676 970 690 930 688 L840 678 C760 668 680 664 600 664 Z" fill="url(#paintV)"/>
    <!-- hood form: central power dome + shoulder creases (light/dark strokes) -->
    <path d="M600 480 C690 484 790 492 860 530 C880 548 880 580 850 600 C790 606 700 604 600 606 Z" fill="url(#hood)"/>
    <path d="M640 500 C720 506 800 520 850 550" stroke="#ffb3a6" stroke-opacity=".55" stroke-width="3" fill="none" filter="url(#blur2)"/>
    <path d="M870 470 C930 470 975 500 995 548" stroke="#ffd0c6" stroke-opacity=".7" stroke-width="4" fill="none" filter="url(#blur2)"/>
    <path d="M700 612 C780 616 840 626 900 650" stroke="#4a0000" stroke-opacity=".6" stroke-width="5" fill="none" filter="url(#blur2)"/>
    <!-- windscreen + roof -->
    <path d="M600 250 C700 252 770 266 806 300 C838 340 858 410 872 462 C790 470 690 474 600 476 Z" fill="url(#glass)"/>
    <path d="M600 218 C700 218 790 236 824 286 L806 302 C770 266 700 252 600 250 Z" fill="url(#roof)"/><path d="M620 226 C700 228 770 242 806 272" stroke="#ffffff" stroke-opacity=".28" stroke-width="3" fill="none" filter="url(#blur2)"/>
    <path d="M630 262 C720 268 770 284 796 316 L770 322 C740 292 690 280 630 276Z" fill="#cfe0ff" opacity=".13"/>
    <!-- A-pillar/scuttle trim -->
    <path d="M806 300 C838 340 858 410 872 462 L850 466 C838 408 820 346 790 306Z" fill="#150808"/>
    <!-- mirror -->
    <path d="M936 424 C972 408 1006 414 1014 440 C1016 462 996 476 960 476 C938 472 930 448 936 424Z" fill="url(#paint)"/>
    <path d="M944 428 C972 418 1000 422 1008 440" stroke="#ffd0c6" stroke-opacity=".7" stroke-width="3" fill="none" filter="url(#blur2)"/>
    <rect x="950" y="470" width="30" height="14" rx="4" fill="#0b0b0c"/>
    <!-- headlight -->
    <path d="M846 566 C896 540 950 528 992 522 C1002 540 1000 556 990 566 C950 570 896 584 860 596 Z" fill="#0b0b0e"/>
    <g class="led" fill="#f4faff"><rect x="944" y="540" width="40" height="5" rx="2" transform="rotate(-8 944 540)"/><rect x="936" y="550" width="42" height="5" rx="2" transform="rotate(-8 936 550)"/><rect x="928" y="560" width="42" height="5" rx="2" transform="rotate(-8 928 560)"/></g>
    <path d="M848 568 C900 544 950 532 990 526" stroke="#8aa0b8" stroke-opacity=".5" stroke-width="2" fill="none"/>
    <!-- lower intake with mesh -->
    <path d="M600 626 C720 626 800 630 868 640 C896 650 900 676 880 684 C800 690 700 690 640 688Z" fill="#050506"/>
    <path d="M600 634 C730 634 800 638 856 646 C882 654 884 674 868 680 C800 684 720 684 600 682Z" fill="url(#mesh)"/>
    <!-- splitter -->
    <path d="M590 684 C720 690 860 696 960 700 C990 702 1012 704 1020 712 L600 716 Z" fill="url(#carbon)"/>
    <path d="M600 686 C730 692 870 698 970 702" stroke="#6b6b73" stroke-width="2" fill="none" opacity=".7"/>
    <path d="M602 664 C720 668 860 676 940 688" stroke="#ffb3a6" stroke-opacity=".5" stroke-width="3" fill="none" filter="url(#blur2)"/><path d="M640 622 C730 620 810 624 872 634" stroke="#000" stroke-width="6" fill="none" opacity=".55"/><path d="M650 616 C730 614 800 618 860 628" stroke="#ff8a78" stroke-width="2" fill="none" opacity=".45"/><path d="M880 600 C940 600 990 620 1006 660 C980 690 930 690 900 684 C910 660 900 630 880 600Z" fill="#000" opacity=".22" filter="url(#blur6)"/><!-- side intake near wheel -->
    <path d="M938 620 C970 618 992 632 996 656 C970 668 944 660 934 640Z" fill="#050506"/>
  </g>
</defs>

<!-- environment: dusk sky, horizon, track, kerb -->
<rect width="1200" height="800" fill="url(#sky)"/>
<rect y="330" width="1200" height="470" fill="url(#asph)"/>
<rect y="318" width="1200" height="14" fill="#2c2c30" opacity=".8"/>
<g opacity=".9"><path d="M0 338 H1200" stroke="#cfcfd2" stroke-width="2" opacity=".35"/>
  <g id="kerb" fill="#c9c9cc"><rect x="0" y="328" width="60" height="9"/><rect x="120" y="328" width="60" height="9"/><rect x="240" y="328" width="60" height="9"/><rect x="360" y="328" width="60" height="9"/><rect x="480" y="328" width="60" height="9"/><rect x="600" y="328" width="60" height="9"/><rect x="720" y="328" width="60" height="9"/><rect x="840" y="328" width="60" height="9"/><rect x="960" y="328" width="60" height="9"/><rect x="1080" y="328" width="60" height="9"/></g>
  <g fill="#b01a1a"><rect x="60" y="328" width="60" height="9"/><rect x="180" y="328" width="60" height="9"/><rect x="300" y="328" width="60" height="9"/><rect x="420" y="328" width="60" height="9"/><rect x="540" y="328" width="60" height="9"/><rect x="660" y="328" width="60" height="9"/><rect x="780" y="328" width="60" height="9"/><rect x="900" y="328" width="60" height="9"/><rect x="1020" y="328" width="60" height="9"/><rect x="1140" y="328" width="60" height="9"/></g></g>

<!-- ground contact shadow + reflection glow -->
<ellipse cx="600" cy="712" rx="470" ry="46" fill="#000" opacity=".65" filter="url(#blur14)"/>
<ellipse cx="600" cy="722" rx="380" ry="16" fill="#ff2a1a" opacity=".12" filter="url(#blur14)"/>

<g id="car">
  <use href="#half"/>
  <use href="#half" transform="translate(1200 0) scale(-1 1)"/>
  <!-- centre seam + bonnet vent + no badge (intentionally unmarked) -->
  <path d="M600 478 V664" stroke="#5a0a0a" stroke-opacity=".55" stroke-width="2"/>
  <path d="M600 214 V250" stroke="#000" stroke-opacity=".5" stroke-width="2"/>
  <!-- moving light sweep across the paint -->
  <g clip-path="url(#bodyClip)"><g class="sweep"><path d="M-80 470 L120 470 L40 700 L-160 700Z" fill="#fff" opacity=".14" filter="url(#blur14)"/></g></g>
</g>
<clipPath id="bodyClip"><use href="#bodyR"/><use href="#bodyR" transform="translate(1200 0) scale(-1 1)"/></clipPath>
</svg></div>
<div class="cap">Generic supercar · original vector render · no brand marks</div>
<script>
/* gentle 3D parallax toward the cursor / scroll; off for reduced motion */
const s=document.getElementById('s');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
  let tx=0,ty=0,x=0,y=0;
  addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*8;ty=(e.clientY/innerHeight-.5)*-5});
  (function f(){x+=(tx-x)*.06;y+=(ty-y)*.06;s.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`;requestAnimationFrame(f)})();
}
</script>
