<!doctype html>
<meta charset="utf-8"><title>Procedural supercar (generic, no marks)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;background:#0a0a0b}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .cap{z-index:2;position:fixed;left:16px;bottom:12px;font:11px/1.2 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8a8a8e}
</style>
<canvas id="c"></canvas><div class="cap">Generic procedural supercar · concept · no brand marks</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Procedural supercar. Tunable: CAR.color, CAR.len. Everything is generated: no assets, no logos. */
const CAR={color:0xb3120f,len:4.6,wid:1.95,hgt:1.12};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0x0a0a0b);S.fog=new THREE.Fog(0x0a0a0b,9,20);
const cam=new THREE.PerspectiveCamera(32,1,.1,60);

/* studio environment: gradient + softbox strips painted to an equirect canvas, then PMREM */
(function env(){
  const w=1024,h=512,k=document.createElement('canvas');k.width=w;k.height=h;const g=k.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2a2c33');gr.addColorStop(.5,'#0d0d10');gr.addColorStop(1,'#050506');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  const box=(x,y,bw,bh,a)=>{g.fillStyle=`rgba(255,244,230,${a})`;g.fillRect(x,y,bw,bh)};
  box(120,70,260,26,.95);box(560,50,360,18,.9);box(300,160,30,160,.7);box(760,150,26,170,.7);box(0,200,1024,4,.25);
  const t=new THREE.CanvasTexture(k);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
  const p=new THREE.PMREMGenerator(R);S.environment=p.fromEquirectangular(t).texture;t.dispose();p.dispose();
})();
S.add(new THREE.HemisphereLight(0x8890a8,0x050506,.35));
const key=new THREE.DirectionalLight(0xfff1e0,1.6);key.position.set(-4,6,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
Object.assign(key.shadow.camera,{left:-5,right:5,top:5,bottom:-5,near:1,far:20});key.shadow.bias=-.0004;S.add(key);
const rim=new THREE.DirectionalLight(0xff4a3a,1.1);rim.position.set(5,2.5,-5);S.add(rim);

const car=new THREE.Group();S.add(car);
const L=CAR.len,W=CAR.wid,H=CAR.hgt;
const paint=new THREE.MeshPhysicalMaterial({color:CAR.color,metalness:.55,roughness:.28,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.25});
const glass=new THREE.MeshPhysicalMaterial({color:0x06080c,metalness:.1,roughness:.04,clearcoat:1,envMapIntensity:1.6});
const black=new THREE.MeshStandardMaterial({color:0x0b0b0c,roughness:.55,metalness:.3});
const metal=new THREE.MeshStandardMaterial({color:0xc9ccd2,metalness:1,roughness:.22});

/* body: side profile (x along length, y up) extruded across width, then tapered in plan and roof */
function profile(){
  const s=new THREE.Shape();const x0=-L/2,x1=L/2,y0=.2;
  s.moveTo(x0,y0+.1);
  s.bezierCurveTo(x0-.02,y0+.3,x0+.1,y0+.5,x0+.55,y0+.6);          // tail up to rear deck
  s.bezierCurveTo(x0+1.2,y0+.7,x0+1.9,y0+.68,x0+2.5,y0+.62);       // beltline / rear deck
  s.bezierCurveTo(x0+3.1,y0+.55,x0+3.7,y0+.46,x1-.2,y0+.4);        // bonnet
  s.bezierCurveTo(x1+.0,y0+.37,x1+.06,y0+.2,x1-.05,y0+.1);         // nose
  s.lineTo(x1-.2,y0);s.lineTo(x0+.25,y0);s.closePath();return s;
}
const bodyGeo=new THREE.ExtrudeGeometry(profile(),{depth:W,bevelEnabled:true,bevelThickness:.16,bevelSize:.14,bevelSegments:10,curveSegments:48});
bodyGeo.translate(0,0,-W/2);
(function taper(g){const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);let z=p.getZ(i);
    const u=(x+L/2)/L;                                   // 0 tail .. 1 nose
    const plan=1-.30*Math.pow(Math.abs(u-.46)*2,2.2);    // narrower at both ends
    const roof=1-.18*Math.max(0,(y-.45)/.5);             // gentle shoulder tuck
    p.setZ(i,z*plan*roof);}
  g.computeVertexNormals();})(bodyGeo);
const body=new THREE.Mesh(bodyGeo,paint);body.castShadow=true;car.add(body);

/* glasshouse: tapered glass cabin sitting on the beltline, with a slim paint roof panel */
function cabinShape(top){const c=new THREE.Shape();const cx=-L/2,by=.78;
  c.moveTo(cx+1.25,by);c.bezierCurveTo(cx+1.5,by+.2,cx+1.8,by+top,cx+2.15,by+top);   // rear screen up to roof
  c.bezierCurveTo(cx+2.5,by+top,cx+2.75,by+.2,cx+3.05,by);c.closePath();return c;}
const cabGeo=new THREE.ExtrudeGeometry(cabinShape(.5),{depth:W*.62,bevelEnabled:true,bevelThickness:.07,bevelSize:.06,bevelSegments:8,curveSegments:40});
cabGeo.translate(0,0,-W*.31);
(function(g){const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i);p.setZ(i,p.getZ(i)*(1-.28*Math.max(0,(y-.78)/.5)));}g.computeVertexNormals();})(cabGeo);
const cabin=new THREE.Mesh(cabGeo,glass);car.add(cabin);
const roofGeo=new THREE.ExtrudeGeometry(cabinShape(.53),{depth:W*.42,bevelEnabled:true,bevelThickness:.04,bevelSize:.03,bevelSegments:6,curveSegments:40});
roofGeo.translate(0,.012,-W*.21);roofGeo.scale(.52,1,1);roofGeo.translate(-L/2*.52*0+(-L/2)*.0+ (1-.52)*(-L/2+2.15)*1,0,0);
(function(g){const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i);if(y<1.0)p.setY(i,y+ (1.0-y)*0); }})(roofGeo);
const roof=new THREE.Mesh(roofGeo,paint);roof.position.y=.03;car.add(roof);

/* lights, splitter, diffuser */
const hl=new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xfff2d8,emissiveIntensity:2.2});
const tl=new THREE.MeshStandardMaterial({color:0x330000,emissive:0xff2a1a,emissiveIntensity:2.6});
for(const s of[-1,1]){const h=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,.2),hl);h.position.set(L/2-.34,.58,s*.62);h.rotation.z=-.12;h.rotation.y=s*.18;car.add(h);}
const tail=new THREE.Mesh(new THREE.BoxGeometry(.04,.07,W*.72),tl);tail.position.set(-L/2+.04,.66,0);car.add(tail);
const split=new THREE.Mesh(new THREE.BoxGeometry(.55,.04,W*.92),black);split.position.set(L/2-.05,.24,0);car.add(split);
const diff=new THREE.Mesh(new THREE.BoxGeometry(.5,.12,W*.6),black);diff.position.set(-L/2+.18,.28,0);car.add(diff);
const under=new THREE.Mesh(new THREE.BoxGeometry(L*.9,.04,W*.8),black);under.position.set(0,.22,0);car.add(under);

/* wheels: tyre, machined rim with 5 twin spokes, drilled-style disc, dark arch behind */
function wheel(){const g=new THREE.Group();
  const tyre=new THREE.Mesh(new THREE.TorusGeometry(.32,.13,24,64),new THREE.MeshStandardMaterial({color:0x0c0c0d,roughness:.85}));g.add(tyre);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(.33,.33,.2,48),metal);rim.rotation.x=Math.PI/2;g.add(rim);
  const face=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.215,48),new THREE.MeshStandardMaterial({color:0x14151a,metalness:.9,roughness:.35}));face.rotation.x=Math.PI/2;g.add(face);
  for(let i=0;i<5;i++){const sp=new THREE.Mesh(new THREE.BoxGeometry(.5,.05,.225),metal);sp.rotation.z=i*Math.PI*2/5;sp.position.z=0;g.add(sp);}
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.24,24),new THREE.MeshStandardMaterial({color:0x8a1010,metalness:.7,roughness:.3}));hub.rotation.x=Math.PI/2;g.add(hub);
  return g;}
const wheels=[];
for(const [x,z] of[[L/2-.95,.78],[L/2-.95,-.78],[-L/2+1.0,.82],[-L/2+1.0,-.82]]){
  const w=wheel();w.position.set(x,.455,z);w.scale.setScalar(x<0?.94:.86);car.add(w);wheels.push(w);
  const arch=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.28,40),black);arch.rotation.x=Math.PI/2;arch.position.set(x,.47,z*.9);car.add(arch);
}
car.position.y=-.02;

/* floor: soft reflective plate + contact shadow */
const floor=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshStandardMaterial({color:0x0b0b0d,roughness:.6,metalness:.25}));
floor.rotation.x=-Math.PI/2;floor.position.y=-.01;floor.receiveShadow=true;S.add(floor);

function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* motion: slow orbit + scroll-driven camera path; wheels roll; reduced-motion = one calm still angle */
let sp=0;addEventListener('scroll',()=>{sp=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)},{passive:true});
document.body.style.minHeight='400vh';
const t0=performance.now();
function frame(){const t=(performance.now()-t0)/1000;
  const Q=new URLSearchParams(location.search);
  const a=Q.has('a')?parseFloat(Q.get('a')):(reduce?-0.55:(-0.55+t*.12+sp*Math.PI*1.6));
  const rad=7.2-sp*1.6, el=1.35-sp*.55;
  cam.position.set(Math.cos(a)*rad,el,Math.sin(a)*rad);cam.lookAt(0,.62,0);
  if(!reduce)wheels.forEach(w=>w.rotation.z=-t*2.2);
  R.render(S,cam);requestAnimationFrame(frame)}
frame();
</script>
