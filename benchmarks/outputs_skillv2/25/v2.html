<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Creative</title>
<style>
:root { --accent:#c9622d; --ink:#1c1c1c; --bg:#faf8f4; }
* { box-sizing:border-box; }
body{ margin:0; font-family:-apple-system,'Segoe UI',sans-serif; background:#faf8f4; color:#1c1c1c; }
.btn { display:inline-flex; align-items:center; justify-content:center; min-height:44px; padding:0 20px;
  border-radius:6px; background:var(--ink); color:#fff; border:none; font-size:16px; cursor:pointer; }
em { font-style:italic; color:var(--accent); }
@media (max-width:480px) { .grid { grid-template-columns:1fr; } }

</style>
</head>
<body>
<main style="max-width:600px;margin:0 auto;aspect-ratio:1080/1350;background:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px;">
  <h1 style="font-size:36px;margin:0;">Marketing Creative</h1>
  <p style="font-size:18px;color:#555;">Design a 1080x1350 Instagram carousel first-slide for a SaaS product's feature launch announcement.</p>
  <button class="btn">Learn more</button>
</main>
<footer style="padding:12px 48px;"><nav aria-label="footer">1/4</nav></footer>
</body>
</html>
